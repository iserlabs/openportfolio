name: open-portfolio

# Composition only -- the `pds` service runs the unmodified, version-pinned
# reference image (spec §9: "Reference PDS unmodified -- composition only,
# never a fork"). Every env var on it either comes from `.env` (secrets,
# generated by setup.sh) or is a fixed, non-secret federation endpoint
# (default public AppView/mod-service/relay/PLC-directory infra, matching the
# reference PDS's own installer.sh conventions) hardcoded below rather than
# left to the image's internal defaults, so this file is the single source of
# truth for what the PDS talks to.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    # DOMAIN must reach the caddy *container's* own environment (not just be
    # substituted into this YAML) -- Caddy resolves `{$DOMAIN}` in the
    # Caddyfile from its own process environment at load time.
    environment:
      - DOMAIN=${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile"
      - "caddy-data:/data"
    depends_on: [pds, app]

  pds:
    image: ghcr.io/bluesky-social/pds:0.4 # version-pinned; never modified
    restart: unless-stopped
    environment:
      - PDS_HOSTNAME=pds.${DOMAIN}
      - PDS_BLOB_UPLOAD_LIMIT=33554432
      - PDS_ADMIN_PASSWORD=${PDS_ADMIN_PASSWORD}
      - PDS_JWT_SECRET=${PDS_JWT_SECRET}
      - PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX=${PDS_ROTATION_KEY}
      # Fixed, non-secret federation endpoints -- same values the reference
      # PDS's own installer.sh writes to pds.env; pinned here rather than left
      # to the image's internal defaults so an upgrade can't silently change
      # who this instance federates with.
      - PDS_DATA_DIRECTORY=/pds
      - PDS_BLOBSTORE_DISK_LOCATION=/pds/blocks
      - PDS_DID_PLC_URL=https://plc.directory
      - PDS_BSKY_APP_VIEW_URL=https://api.bsky.app
      - PDS_BSKY_APP_VIEW_DID=did:web:api.bsky.app
      - PDS_REPORT_SERVICE_URL=https://mod.bsky.app
      - PDS_REPORT_SERVICE_DID=did:plc:ar7c4by46qjdydhdevvrndac
      - PDS_CRAWLERS=https://bsky.network
    volumes: ["pds-data:/pds"]
    # `wget` (busybox, present in this image -- verified via `docker run
    # ... which wget`) rather than curl, which the pds image doesn't ship.
    # `app`'s `depends_on` below waits on this, not just "container
    # started" -- setup.sh's own health-poll loop is the belt-and-suspenders
    # version of the same check for the *first* boot (before this
    # healthcheck has had time to pass), but subsequent `docker compose up`
    # restarts of `app` alone benefit from Compose enforcing it directly.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/xrpc/_health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  app:
    build: { context: .., dockerfile: apps/site/Dockerfile }
    restart: unless-stopped
    depends_on:
      pds:
        condition: service_healthy
    environment:
      - PDS_URL=https://pds.${DOMAIN}
      - PUBLIC_URL=https://${DOMAIN}
      - OWNER_DID=${OWNER_DID}
      - SESSION_SECRET=${SESSION_SECRET}
      - OAUTH_JWK=${OAUTH_JWK}
      - SQLITE_PATH=/data/app.db
      - BACKUP_DIR=/backups
    volumes:
      - "app-data:/data"
      - "./backups:/backups"

volumes:
  caddy-data: {}
  pds-data: {}
  app-data: {}
